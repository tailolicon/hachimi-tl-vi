name: Aggregate parallel translation results

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: aggregate-parallel-translations
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reset to latest main and fetch pinned source queue
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B aggregate-work origin/main
          source_ref="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('work/parallel_state.json').read_text())
          epoch = json.loads(Path(state['current_epoch_metadata']).read_text())
          print(epoch['source_queue_git_commit'])
          PY
          )"
          git fetch origin "$source_ref"
      - name: Install translator tooling
        run: python -m pip install -e "."
      - name: Validate and aggregate completed shards
        run: python scripts/aggregate_parallel_results.py --repo-root .
      - name: Apply reviewed compact UI overrides
        run: python scripts/apply_ui_overrides.py --repo-root .
      - name: Validate Hachimi output and regenerate index
        shell: bash
        run: |
          set -euo pipefail
          tlvi --db /tmp/tlvi-aggregate.db validate
          tlvi --db /tmp/tlvi-aggregate.db index
      - name: Commit aggregated output
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # aggregation_report.json is an ephemeral diagnostic generated on every
          # run; do not let its timestamp-only churn fail the clean-tree guard.
          rm -f work/aggregation_report.json
          git add localized_data index.json work/parallel
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Aggregate completed translation shards"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Unexpected working tree changes before rebase:" >&2
            git status --short >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "Failed to push aggregated output after retries" >&2
          exit 1
      - name: Publish Hachimi release branch
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B _publish_main origin/main

          # Reapply reviewed UI labels after any just-merged worker output.
          python scripts/apply_ui_overrides.py --repo-root .

          # Keep the aggregate publisher equivalent to release.yml so it never
          # overwrites the release branch without the Vietnamese font bundles.
          source_commit="53d1a948dbf3eb105e57ff95ad8562e2961b8d1c"
          base="https://raw.githubusercontent.com/Shigure-Ruiseki/hachimi-tl-vi/${source_commit}/localized_data"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/includes_android" -o localized_data/includes_android
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/includes_win" -o localized_data/includes_win
          test -s localized_data/includes_android
          test -s localized_data/includes_win

          tlvi --db /tmp/tlvi-parallel-release.db validate
          tlvi --db /tmp/tlvi-parallel-release.db index

          tmp="$(mktemp -d)"
          cp -a localized_data "$tmp/localized_data"
          cp index.json "$tmp/index.json"
          cp meta.json "$tmp/meta.json"
          git checkout --orphan _parallel_release_build
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf localized_data index.json meta.json
          cp -a "$tmp/localized_data" ./localized_data
          cp "$tmp/index.json" ./index.json
          cp "$tmp/meta.json" ./meta.json
          git add localized_data index.json meta.json
          git commit -m "Publish aggregated Vietnamese translation"
          git push --force origin HEAD:release
