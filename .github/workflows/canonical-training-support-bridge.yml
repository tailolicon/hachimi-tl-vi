name: Canonical Training Support Bridge

on:
  push:
    branches:
      - canonical-training-support-hardening
    paths:
      - .github/workflows/canonical-training-support-bridge.yml

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-training-support-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Materialize Training Support canon
        run: python scripts/harden_training_support_canon.py
      - name: Focused regression tests
        run: pytest -q tests/test_training_support_hardening.py --tb=short
      - name: Full pytest
        run: pytest -q --tb=short
      - name: Validate project
        run: tlvi --db /tmp/tlvi.db validate
      - name: Build index smoke test
        run: tlvi --db /tmp/tlvi.db index --out /tmp/index.json
      - name: Commit generated canonical files
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          if git diff --quiet -- glossary/term_registry.json glossary/ui_community_terms.json; then
            echo "No generated glossary changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glossary/term_registry.json glossary/ui_community_terms.json
          git commit -m "Materialize Training Support canonical hardening"
          git push origin HEAD:canonical-training-support-hardening
