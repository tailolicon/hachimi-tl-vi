name: Character domain materialize checkpoint

on:
  push:
    branches:
      - canonical-character-training-ui-hardening
    paths:
      - .github/workflows/character-domain-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-character-training-ui-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Materialize and prove idempotence
        shell: bash
        run: |
          python scripts/harden_character_training_ui_canon.py
          before=$(git diff | sha256sum | cut -d' ' -f1)
          python scripts/harden_character_training_ui_canon.py
          after=$(git diff | sha256sum | cut -d' ' -f1)
          test "$before" = "$after"
      - name: Focused regression suite
        run: python -m pytest -q tests/test_character_training_ui_aptitude_grade.py tests/test_character_training_ui_career_mode.py tests/test_character_training_ui_hardening.py tests/test_character_training_ui_sync_source.py
      - name: Persist checkpoint and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/character-domain-materialize.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add glossary/term_registry.json glossary/ui_community_terms.json scripts/enforce_player_facing_canon.py .github/workflows/character-domain-materialize.yml
          git commit -m "Materialize character training UI canon"
          git push origin HEAD:canonical-character-training-ui-hardening
