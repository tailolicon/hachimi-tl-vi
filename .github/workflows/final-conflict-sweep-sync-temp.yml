name: TEMP Final conflict sweep production Sync no-op

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-conflict-sweep-sync-temp.yml"

permissions:
  contents: write

concurrency:
  group: canonical-final-conflict-sweep-sync
  cancel-in-progress: false

jobs:
  sync-noop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Production Sync then prove unchanged no-op
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_sync() {
            python scripts/enforce_player_facing_canon.py
            python scripts/harden_skill_inheritance_canon.py
            python scripts/harden_race_canon.py
            python scripts/harden_training_support_canon.py
            python scripts/harden_resources_gacha_shop_canon.py
            python scripts/harden_common_ui_labels.py
            python scripts/harden_character_training_ui_canon.py
            python scripts/harden_missions_events_canon.py
            python scripts/canonical_findings.py --repo-root . --refresh
            python -m pip install -e ".[dev]"
            pytest -q
            python scripts/build_translation_review_plan.py --repo-root . --batch-size 20
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from scripts.build_translation_review_plan import normalize_gate_state_for_noop

          path = Path("work/parallel_state.json")
          before = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:work/parallel_state.json"],
              encoding="utf-8",
          ))
          after = json.loads(path.read_text(encoding="utf-8"))
          normalized = normalize_gate_state_for_noop(after, before)
          if normalized != after:
              path.write_text(json.dumps(normalized, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          }

          stage_sync() {
            git add \
              TRANSLATION_REVIEW.md \
              glossary/term_registry.json \
              glossary/ui_community_terms.json \
              glossary/source_bridge_terms.json \
              glossary/translation_audit_policy.json \
              glossary/canonical_findings.json \
              scripts/enforce_player_facing_canon.py \
              scripts/harden_skill_inheritance_canon.py \
              scripts/harden_race_canon.py \
              scripts/harden_training_support_canon.py \
              scripts/harden_resources_gacha_shop_canon.py \
              scripts/harden_common_ui_labels.py \
              scripts/harden_character_training_ui_canon.py \
              scripts/harden_missions_events_canon.py \
              scripts/canonical_findings.py \
              scripts/translation_review_common.py \
              scripts/build_translation_review_plan.py \
              scripts/merge_translation_review.py \
              scripts/merge_parallel_results.py \
              scripts/aggregate_parallel_results.py \
              tests \
              src/hachimi_tl_vi/translation_guard.py \
              src/hachimi_tl_vi/context_categories.py \
              work/translation_review \
              work/parallel_state.json
          }

          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B final-conflict-sweep-production-sync origin/main
            run_sync
            stage_sync
            git rm .github/workflows/final-conflict-sweep-sync-temp.yml
            git commit -m "Translation review: final canonical conflict sweep sync"
            if git push origin HEAD:main; then
              echo "FIRST_SYNC_SHA=$(git rev-parse HEAD)"
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$pushed" != true ]; then
            echo "Failed to publish first production Sync after retries" >&2
            exit 1
          fi

          git fetch origin main
          git checkout -B final-conflict-sweep-production-sync-noop origin/main
          run_sync
          stage_sync
          if ! git diff --cached --quiet; then
            echo "Second unchanged production Sync was not a semantic no-op" >&2
            git diff --cached --stat >&2
            exit 1
          fi
          echo "SECOND_SYNC_NOOP=true"
