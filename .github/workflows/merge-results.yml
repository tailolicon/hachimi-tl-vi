name: Merge parallel translation results

on:
  push:
    branches: [main]
    paths:
      - "work/completions/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Refresh main and fetch pinned source history
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git fetch origin source-zhcn:refs/remotes/origin/source-zhcn
      - name: Merge complete batches
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(python - <<'PY'
          import json
          print(json.load(open("work/translation_progress.json", encoding="utf-8"))["source_batch_ref"])
          PY
          )"
          python scripts/merge_parallel_results.py --source-ref "$source_ref"
      - name: Validate merged translation
        shell: bash
        run: |
          set -euo pipefail
          tlvi --db /tmp/tlvi.db validate
          tlvi --db /tmp/tlvi.db index
      - name: Commit merge
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No complete batch ready to merge."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localized_data index.json work/translation_progress.json work/merged work/claims work/merge_diagnostics.json 2>/dev/null || true
          git add -u
          git commit -m "Merge completed parallel translation batches"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Unable to push merged results after retries." >&2
          exit 1
