name: Merge translation review results

# Review workers write partial result checkpoints frequently. Do not trigger this
# reconciler from results/** or completions/**: doing so creates an unbounded
# serial Actions backlog while workers are healthy. Instead, reconcile the whole
# durable backlog on a bounded cadence. A run always reads latest main and drains
# every completion currently available.
on:
  push:
    branches: [main]
    paths:
      - "TRANSLATION_REVIEW.md"
      - "scripts/translation_review_common.py"
      - "scripts/canonical_findings.py"
      - "scripts/build_translation_review_plan.py"
      - "scripts/merge_translation_review.py"
      - "scripts/build_translation_regression_memory.py"
      - "src/hachimi_tl_vi/translation_guard.py"
      - "src/hachimi_tl_vi/translators/prompt.py"
      - "glossary/source_bridge_terms.json"
      - "glossary/source_bridge_risks.generated.json"
      - "glossary/translation_regressions.generated.json"
      - "glossary/canonical_findings.json"
      - "tests/test_translation_review_source_bridge.py"
      - "tests/test_canonical_findings.py"
      - "tests/test_orchestration_finalization.py"
      - "tests/test_orchestration_state.py"
      - "tests/test_translation_review_merge_workflow.py"
      - ".github/workflows/merge-translation-review.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: merge-translation-review
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B translation-review-merge origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Merge completed retrospective reviews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          quarantine_file=/tmp/translation-review-quarantine.tsv
          : > "$quarantine_file"

          merge_with_quarantine() {
            local merge_output merge_rc error_line batch_id bad_completion
            for quarantine_attempt in $(seq 1 25); do
              # A failed merge can have written untracked merged markers before
              # raising. Reset every retry so those partial markers can never make
              # a valid batch look already merged without its reviewed-index/data
              # changes being persisted.
              git reset --hard HEAD
              git clean -fd -- work/translation_review/merged

              if [[ -s "$quarantine_file" ]]; then
                while IFS=$'\t' read -r bad_completion _; do
                  [[ -n "$bad_completion" ]] && rm -f "$bad_completion"
                done < "$quarantine_file"
              fi

              set +e
              merge_output=$(python scripts/merge_translation_review.py --repo-root . 2>&1)
              merge_rc=$?
              set -e
              printf '%s\n' "$merge_output"
              if [[ $merge_rc -eq 0 ]]; then
                return 0
              fi

              # Per-batch validation failures are quarantined for this run only.
              # Unknown/global failures still fail loudly rather than being hidden.
              error_line=$(printf '%s\n' "$merge_output" | grep -E 'ValueError:' | tail -n 1 || true)
              batch_id=$(printf '%s\n' "$error_line" | sed -nE 's/.*ValueError: ([^:[:space:]]+):.*/\1/p')
              bad_completion=""

              if [[ -n "$batch_id" && -d "work/translation_review/completions/$batch_id" ]]; then
                bad_completion=$(find "work/translation_review/completions/$batch_id" -type f -name '*.json' | sort | head -n 1)
              fi
              if [[ -z "$bad_completion" ]]; then
                bad_completion=$(printf '%s\n' "$error_line" | sed -nE 's/.*invalid completion marker: (.*)$/\1/p')
              fi

              if [[ -z "$bad_completion" || ! -f "$bad_completion" ]]; then
                echo "Merge failed for a non-quarantinable/global reason." >&2
                return "$merge_rc"
              fi
              if grep -Fq "$bad_completion"$'\t' "$quarantine_file"; then
                echo "Repeated failure for already quarantined completion: $bad_completion" >&2
                return "$merge_rc"
              fi

              printf '%s\t%s\n' "$bad_completion" "${error_line//$'\t'/ }" >> "$quarantine_file"
              echo "::warning::Quarantining malformed review completion for this merge run: $bad_completion"
            done

            echo "Too many malformed completion markers in one merge run." >&2
            return 1
          }

          # Full validation can take minutes while review workers continue to push
          # task-local checkpoints. Those writes must not starve the validated
          # integration commit. We recompute only when main changed semantically;
          # worker evidence and README-only movement are rebased after validation.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B translation-review-merge origin/main
            validated_base=$(git rev-parse HEAD)

            merge_with_quarantine

            # Restore source completion markers before committing. Quarantine is a
            # fail-soft merge policy, not deletion of worker evidence.
            if [[ -s "$quarantine_file" ]]; then
              while IFS=$'\t' read -r bad_completion _; do
                git checkout -- "$bad_completion"
              done < "$quarantine_file"
            fi

            python - "$quarantine_file" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          src = Path(sys.argv[1])
          report_path = Path("work/translation_review/quarantine_report.json")
          entries = []
          if src.exists():
              for raw in src.read_text(encoding="utf-8").splitlines():
                  if not raw.strip():
                      continue
                  path, _, error = raw.partition("\t")
                  p = Path(path)
                  entries.append({
                      "completion_path": path,
                      "batch_id": p.parent.name,
                      "claim_id": p.stem,
                      "error": error,
                  })
          previous = {}
          if report_path.exists():
              try:
                  previous = json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  previous = {}
          if previous.get("entries") != entries:
              payload = {
                  "schema_version": 1,
                  "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                  "policy": "Malformed completion markers are quarantined per merge run so valid review batches continue; source evidence is never deleted.",
                  "entries": entries,
              }
              report_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

            python scripts/build_translation_regression_memory.py --repo-root .
            python scripts/canonical_findings.py --repo-root . --refresh
            # canonical_findings --refresh reconstructs the worker ledger. Reapply
            # every production resolver that repairs generated finding resolutions
            # before queue generation/validation, matching the context-sync path so
            # retrospective review merges cannot reopen already accepted blockers.
            python scripts/resolve_scoped_canonical_overrides.py --repo-root .
            python scripts/resolve_context_guard_findings.py
            python scripts/resolve_running_style_narrative_finding.py
            python scripts/resolve_regenerated_super_long_distance_context_finding.py
            python scripts/resolve_regenerated_aoharu_ignition_finding.py
            python scripts/resolve_regenerated_initial_friendship_finding.py
            python scripts/resolve_regenerated_grand_live_performance_stats_findings.py
            python scripts/build_terminology_review_queue.py
            pytest -q
            tlvi --db /tmp/tlvi-translation-review.db validate
            tlvi --db /tmp/tlvi-translation-review.db index
            python scripts/build_translation_review_plan.py --repo-root . --batch-size 20

            git add localized_data index.json glossary/translation_regressions.generated.json glossary/canonical_findings.json glossary/terminology_review_queue.json work/translation_review work/parallel_state.json
            if git diff --cached --quiet; then
              echo "No new completed translation review work or regression memory changes to merge."
              exit 0
            fi
            git commit -m "Merge retrospective translation review"

            # Publish the already-validated commit across harmless concurrent
            # worker/checkpoint and README commits. If code, canonical policy,
            # localized data, or review state changed, discard and recompute.
            for publish_attempt in $(seq 1 20); do
              git fetch origin main
              remote_main=$(git rev-parse origin/main)
              unsafe_changes=$(git diff --name-only "$validated_base" "$remote_main" | grep -Ev '^(README\.md$|work/translation_review/(claims|results|completions)/)' || true)
              if [[ -n "$unsafe_changes" ]]; then
                echo "Main changed in validation-sensitive paths; recomputing from latest main:"
                printf '%s\n' "$unsafe_changes"
                break
              fi

              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe-path rebase conflicted; recomputing."
                break
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 1
            done
            sleep "$attempt"
          done

          echo "Failed to merge translation review results after retries" >&2
          exit 1
