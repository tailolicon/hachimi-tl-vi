name: Reap stale UI review claims

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reap-ui-review-claims
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove expired claims safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B reap-ui-review origin/main
            python scripts/reap_ui_review_claims.py --repo-root .
            git add -A work/ui_review/claims
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "UI review: reap stale claims"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to reap UI review claims after retries" >&2
          exit 1
