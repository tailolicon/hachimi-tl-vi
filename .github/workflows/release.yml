name: Publish Hachimi release branch

on:
  push:
    branches: [main]
    paths:
      - "localized_data/**"
      - "index_base.json"
      - "meta.json"
      - "glossary/ui_overrides.json"
      - "glossary/ui_short_forms.json"
      - "src/hachimi_tl_vi/indexer.py"
      - "src/hachimi_tl_vi/blake3_fallback.py"
      - "src/hachimi_tl_vi/ui_policy.py"
      - "scripts/apply_ui_overrides.py"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

      - name: Apply reviewed compact UI overrides
        run: python scripts/apply_ui_overrides.py --repo-root .

      # Hachimi loads replacement fonts from a platform-specific Unity AssetBundle.
      # Pin the known-working Vietnamese community bundles so releases are reproducible.
      - name: Fetch Vietnamese game font bundles
        shell: bash
        run: |
          set -euo pipefail
          source_commit="53d1a948dbf3eb105e57ff95ad8562e2961b8d1c"
          base="https://raw.githubusercontent.com/Shigure-Ruiseki/hachimi-tl-vi/${source_commit}/localized_data"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/includes_android" -o localized_data/includes_android
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/includes_win" -o localized_data/includes_win
          test -s localized_data/includes_android
          test -s localized_data/includes_win

      - run: tlvi --db /tmp/tlvi.db validate
      - run: tlvi --db /tmp/tlvi.db index
      - name: Build release branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a localized_data "$tmp/localized_data"
          cp index.json "$tmp/index.json"
          cp meta.json "$tmp/meta.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan _release_build
          git rm -rf . >/dev/null 2>&1 || true

          # The downloaded font bundles are untracked on main. Remove the old
          # working-tree directory before restoring the staged release payload,
          # otherwise cp would create localized_data/localized_data/.
          rm -rf localized_data index.json meta.json

          cp -a "$tmp/localized_data" ./localized_data
          cp "$tmp/index.json" ./index.json
          cp "$tmp/meta.json" ./meta.json
          git add localized_data index.json meta.json
          git commit -m "Publish translation data"
          git push --force origin HEAD:release
