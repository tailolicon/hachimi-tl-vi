name: Publish Hachimi release branch

on:
  push:
    branches: [main]
    paths:
      - "localized_data/**"
      - "index_base.json"
      - "meta.json"
      - "glossary/ui_overrides.json"
      - "glossary/ui_short_forms.json"
      - "src/hachimi_tl_vi/indexer.py"
      - "src/hachimi_tl_vi/blake3_fallback.py"
      - "src/hachimi_tl_vi/ui_policy.py"
      - "scripts/apply_ui_overrides.py"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  # Translation/review integration commits are created with GITHUB_TOKEN.
  # GitHub deliberately does not start a second push-triggered workflow from
  # those commits, so listen to the successful producer workflows explicitly.
  workflow_run:
    workflows:
      - "Merge translation review results"
      - "Aggregate parallel translation results"
      - "Merge UI review results"
      - "Merge parallel translation results"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-hachimi-release
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether workflow-generated changes need publishing
        id: release_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          if [[ -z "${PRODUCER_HEAD_SHA:-}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${PRODUCER_HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$PRODUCER_HEAD_SHA" || true
          fi

          if git diff --quiet "$PRODUCER_HEAD_SHA" origin/main -- \
            localized_data \
            index_base.json \
            meta.json \
            glossary/ui_overrides.json \
            glossary/ui_short_forms.json \
            src/hachimi_tl_vi/indexer.py \
            src/hachimi_tl_vi/blake3_fallback.py \
            src/hachimi_tl_vi/ui_policy.py \
            scripts/apply_ui_overrides.py \
            pyproject.toml; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Producer completed without release-sensitive changes; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.release_gate.outputs.publish == 'true'
        with:
          python-version: "3.11"
      - if: steps.release_gate.outputs.publish == 'true'
        run: python -m pip install -e ".[dev]"
      - if: steps.release_gate.outputs.publish == 'true'
        run: pytest -q

      - name: Apply reviewed compact UI overrides
        if: steps.release_gate.outputs.publish == 'true'
        run: python scripts/apply_ui_overrides.py --repo-root .

      # Hachimi loads replacement fonts from a platform-specific Unity AssetBundle.
      # Pin the known-working Vietnamese community bundles so releases are reproducible.
      - name: Fetch Vietnamese game font bundles
        if: steps.release_gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_commit="53d1a948dbf3eb105e57ff95ad8562e2961b8d1c"
          base="https://raw.githubusercontent.com/Shigure-Ruiseki/hachimi-tl-vi/${source_commit}/localized_data"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/includes_android" -o localized_data/includes_android
          curl --fail --location --retry 3 --retry-delay 2 \
            "$base/includes_win" -o localized_data/includes_win
          test -s localized_data/includes_android
          test -s localized_data/includes_win

      - if: steps.release_gate.outputs.publish == 'true'
        run: tlvi --db /tmp/tlvi.db validate
      - if: steps.release_gate.outputs.publish == 'true'
        run: tlvi --db /tmp/tlvi.db index
      - name: Build release branch
        if: steps.release_gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a localized_data "$tmp/localized_data"
          cp index.json "$tmp/index.json"
          cp meta.json "$tmp/meta.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan _release_build
          git rm -rf . >/dev/null 2>&1 || true

          # The downloaded font bundles are untracked on main. Remove the old
          # working-tree directory before restoring the staged release payload,
          # otherwise cp would create localized_data/localized_data/.
          rm -rf localized_data index.json meta.json

          cp -a "$tmp/localized_data" ./localized_data
          cp "$tmp/index.json" ./index.json
          cp "$tmp/meta.json" ./meta.json
          git add localized_data index.json meta.json
          git commit -m "Publish translation data"
          git push --force origin HEAD:release
