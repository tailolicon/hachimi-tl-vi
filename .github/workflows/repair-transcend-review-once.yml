name: Repair stale Transcend terminology review once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-transcend-review-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align stale decision with canonical registry lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("glossary/terminology_reviews.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          decision_id = "audit.finding.skill-transcend-overdrive"
          matches = [d for d in data.get("decisions", []) if d.get("decision_id") == decision_id]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one {decision_id}, found {len(matches)}")
          decision = matches[0]
          expected_old = "Overdrive giải phóng địa nhiệt"
          expected_new = "Giải phóng địa nhiệt Overdrive"
          if decision.get("target_vi") == expected_new:
              print("decision already aligned")
          elif decision.get("target_vi") == expected_old:
              decision["target_vi"] = expected_new
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          else:
              raise SystemExit(f"unexpected target_vi: {decision.get('target_vi')!r}")
          PY
      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-transcend-review-once.yml
          git add glossary/terminology_reviews.json
          git diff --cached --check
          git commit -m "Align Transcend terminology review with canonical lock"
          git push origin HEAD:main
