name: Stage canonical finding pipeline

on:
  push:
    branches: [main]
    paths:
      - "scripts/stage_canonical_finding_pipeline.py"
      - ".github/workflows/stage-canonical-finding-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-canonical-finding-pipeline
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply canonical-finding architecture and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B canonical-finding-stage origin/main
            git reset --hard HEAD
            git clean -fd

            python scripts/stage_canonical_finding_pipeline.py

            # Migration compatibility: the stager adds the new helper to
            # translation_review_common.py and wires its call site. Ensure the
            # builder imports it explicitly before validating the generated tree.
            python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_translation_review_plan.py")
          text = path.read_text(encoding="utf-8")
          marker = "from typing import Any\n"
          addition = '''from typing import Any

try:
    from scripts.translation_review_common import load_canonical_findings
except ModuleNotFoundError:
    from translation_review_common import load_canonical_findings  # type: ignore[no-redef]
'''
          if "from scripts.translation_review_common import load_canonical_findings" not in text:
              if marker not in text:
                  raise SystemExit("builder import marker missing")
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

            python scripts/canonical_findings.py --repo-root . --refresh
            python scripts/build_terminology_review_queue.py
            python -m pip install -e ".[dev]"
            pytest -q
            python scripts/build_translation_review_plan.py --repo-root . --batch-size 20
            git diff --check

            rm -f scripts/stage_canonical_finding_pipeline.py
            rm -f .github/workflows/stage-canonical-finding-pipeline.yml

            git add \
              TRANSLATION_REVIEW.md \
              CONTEXT_MAINTENANCE.md \
              glossary/canonical_findings.json \
              glossary/terminology_review_queue.json \
              scripts/canonical_findings.py \
              scripts/translation_review_common.py \
              scripts/build_translation_review_plan.py \
              scripts/merge_translation_review.py \
              scripts/build_terminology_review_queue.py \
              tests/test_canonical_findings.py \
              tests/test_terminology_review.py \
              .github/workflows/merge-translation-review.yml \
              .github/workflows/sync-translation-review-plan.yml \
              .github/workflows/sync-context.yml
            git add -A scripts/stage_canonical_finding_pipeline.py .github/workflows/stage-canonical-finding-pipeline.yml

            git commit -m "Translation review: add canonical-first finding pipeline"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to publish canonical-finding pipeline after retries" >&2
          exit 1
