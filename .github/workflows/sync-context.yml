name: Sync translation context

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_context_registry.py"
      - "scripts/extract_context_candidates.py"
      - "scripts/build_observed_term_memory.py"
      - "scripts/build_terminology_review_queue.py"
      - "scripts/canonical_findings.py"
      - "scripts/resolve_context_guard_findings.py"
      - "scripts/build_source_bridge_risk_registry.py"
      - "scripts/apply_terminology_reviews.py"
      - "scripts/harden_audit_findings.py"
      - "scripts/harden_weekend_challenge_finding.py"
      - "scripts/harden_strongest_team_finding.py"
      - "scripts/harden_triple_tiara_finding.py"
      - "scripts/harden_positive_thinking_finding.py"
      - "scripts/harden_training_rank_finding.py"
      - "scripts/harden_cosmo_puella_song_finding.py"
      - "scripts/harden_tokaeri_no_hana_song_finding.py"
      - "scripts/harden_gochiso_sama_song_finding.py"
      - "scripts/harden_pegasus_punch_song_finding.py"
      - "scripts/harden_asatsuyu_song_finding.py"
      - "scripts/harden_heibon_miracle_song_finding.py"
      - "scripts/harden_sora_no_hohoemi_song_finding.py"
      - "scripts/harden_full_effort_skill_finding.py"
      - "scripts/harden_room_match_finding.py"
      - "scripts/harden_power_context_finding.py"
      - "scripts/harden_aptitude_alias_finding.py"
      - "scripts/harden_jewel_name_overlap_finding.py"
      - "scripts/harden_recovery_spirit_context_finding.py"
      - "scripts/harden_innovation_skill_context_finding.py"
      - "scripts/harden_fast_step_skill_context_finding.py"
      - "scripts/harden_triumph_skill_context_finding.py"
      - "scripts/harden_legend_race_context_finding.py"
      - "scripts/harden_fuchu_himba_context_finding.py"
      - "src/hachimi_tl_vi/context_categories.py"
      - "src/hachimi_tl_vi/context_registry.py"
      - "src/hachimi_tl_vi/translators/prompt.py"
      - "glossary/term_registry.json"
      - "glossary/observed_terms.json"
      - "glossary/terminology_reviews.json"
      - "glossary/canonical_findings.json"
      - "glossary/ui_community_terms.json"
      - "glossary/source_bridge_terms.json"
      - "tests/test_audit_finding_hardening.py"
      - "tests/test_weekend_challenge_finding_hardening.py"
      - "tests/test_strongest_team_finding_hardening.py"
      - "tests/test_triple_tiara_finding_hardening.py"
      - "tests/test_positive_thinking_finding_hardening.py"
      - "tests/test_training_rank_finding_hardening.py"
      - "tests/test_cosmo_puella_song_finding_hardening.py"
      - "tests/test_tokaeri_no_hana_song_finding_hardening.py"
      - "tests/test_gochiso_sama_song_finding_hardening.py"
      - "tests/test_pegasus_punch_song_finding_hardening.py"
      - "tests/test_asatsuyu_song_finding_hardening.py"
      - "tests/test_heibon_miracle_song_finding_hardening.py"
      - "tests/test_sora_no_hohoemi_song_finding_hardening.py"
      - "tests/test_full_effort_skill_finding_hardening.py"
      - "tests/test_room_match_finding_hardening.py"
      - "tests/test_power_context_finding_hardening.py"
      - "tests/test_aptitude_alias_finding_hardening.py"
      - "tests/test_jewel_name_overlap_finding_hardening.py"
      - "tests/test_recovery_spirit_context_finding_hardening.py"
      - "tests/test_innovation_skill_context_finding_hardening.py"
      - "tests/test_fast_step_context_guard_resolution.py"
      - "tests/test_fast_step_skill_context_finding_hardening.py"
      - "tests/test_triumph_skill_context_finding_hardening.py"
      - "tests/test_legend_race_context_finding_hardening.py"
      - "tests/test_fuchu_himba_context_finding_hardening.py"
      - "tests/test_context_guard_finding_resolution.py"
      - "tests/test_jewel_context_guard_resolution.py"
      - "tests/test_recovery_spirit_context_guard_resolution.py"
      - "tests/test_innovation_context_guard_resolution.py"
      - "tests/test_triumph_context_guard_resolution.py"
      - "tests/test_context_registry.py"
      - "tests/test_context_sync.py"
      - "tests/test_prompt_context.py"
      - "tests/test_source_bridge_prompt.py"
      - "tests/test_source_bridge_risk_registry.py"
      - "tests/test_terminology_review.py"
      - "tests/test_apply_terminology_reviews.py"
      - "pyproject.toml"
      - ".github/workflows/sync-context.yml"

permissions:
  contents: write

concurrency:
  group: sync-translation-context
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Sync canonical character identities
        run: python scripts/sync_context_registry.py

      - name: Extract terminology candidates
        run: python scripts/extract_context_candidates.py

      - name: Refresh observed entity terminology
        run: python scripts/build_observed_term_memory.py

      - name: Apply explicit reviewed terminology locks
        run: python scripts/apply_terminology_reviews.py

      - name: Harden audit-discovered canonical rules
        run: python scripts/harden_audit_findings.py

      - name: Harden Weekend Challenge audit finding
        run: python scripts/harden_weekend_challenge_finding.py

      - name: Harden Aim for the Stars event finding
        run: python scripts/harden_strongest_team_finding.py

      - name: Harden Triple Tiara finding
        run: python scripts/harden_triple_tiara_finding.py

      - name: Harden Positive Thinking condition finding
        run: python scripts/harden_positive_thinking_finding.py

      - name: Harden Training Rank finding
        run: python scripts/harden_training_rank_finding.py

      - name: Harden Cosmo Puella song finding
        run: python scripts/harden_cosmo_puella_song_finding.py

      - name: Harden The Bloom of an Era song finding
        run: python scripts/harden_tokaeri_no_hana_song_finding.py

      - name: Harden GOCHISO-SAMA song finding
        run: python scripts/harden_gochiso_sama_song_finding.py

      - name: Harden Soulful Fist Pegasus Punch song finding
        run: python scripts/harden_pegasus_punch_song_finding.py

      - name: Harden Asatsuyu song finding
        run: python scripts/harden_asatsuyu_song_finding.py

      - name: Harden From Ordinary to Extraordinary song finding
        run: python scripts/harden_heibon_miracle_song_finding.py

      - name: Harden Why the Sky Makes Me Smile song finding
        run: python scripts/harden_sora_no_hohoemi_song_finding.py

      - name: Harden full-effort Skill context finding
        run: python scripts/harden_full_effort_skill_finding.py

      - name: Harden Room Match finding
        run: python scripts/harden_room_match_finding.py

      - name: Harden narrative Power context finding
        run: python scripts/harden_power_context_finding.py

      - name: Harden Aptitude alias finding
        run: python scripts/harden_aptitude_alias_finding.py

      - name: Harden Jewel/Daiichi Ruby overlap finding
        run: python scripts/harden_jewel_name_overlap_finding.py

      - name: Harden Recovery Spirit context finding
        run: python scripts/harden_recovery_spirit_context_finding.py

      - name: Harden Innovation Skill context finding
        run: python scripts/harden_innovation_skill_context_finding.py

      - name: Harden fast-step Skill context finding
        run: python scripts/harden_fast_step_skill_context_finding.py

      - name: Harden triumph Skill context finding
        run: python scripts/harden_triumph_skill_context_finding.py

      - name: Harden Legend Race context finding
        run: python scripts/harden_legend_race_context_finding.py

      - name: Harden Fuchu Himba Stakes context finding
        run: python scripts/harden_fuchu_himba_context_finding.py

      - name: Build source-bridge risk registry
        run: python scripts/build_source_bridge_risk_registry.py

      - name: Refresh worker-reported canonical findings
        run: python scripts/canonical_findings.py --repo-root . --refresh

      - name: Resolve context-guard findings
        run: python scripts/resolve_context_guard_findings.py

      - name: Build terminology review queue
        run: python scripts/build_terminology_review_queue.py

      - name: Test context pipeline
        run: pytest -q

      - name: Commit generated context if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            glossary/characters.json \
            glossary/generated_candidates.json \
            glossary/observed_terms.json \
            glossary/term_registry.json \
            glossary/canonical_findings.json \
            glossary/terminology_review_queue.json \
            glossary/ui_community_terms.json \
            glossary/source_bridge_risks.generated.json
          if git diff --cached --quiet; then
            echo "Context is already current."
            exit 0
          fi
          git commit -m "Sync translation context from pinned source"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Concurrent main update; retry $attempt/5"
            sleep $((attempt * 3))
          done
          echo "Could not publish generated context without a safe fast-forward."
          exit 1
