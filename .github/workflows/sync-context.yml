name: Sync translation context

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_context_registry.py"
      - "scripts/extract_context_candidates.py"
      - "scripts/build_observed_term_memory.py"
      - "scripts/build_terminology_review_queue.py"
      - "scripts/canonical_findings.py"
      - "scripts/resolve_scoped_canonical_overrides.py"
      - "scripts/resolve_context_guard_findings.py"
      - "scripts/resolve_running_style_narrative_finding.py"
      - "scripts/resolve_regenerated_super_long_distance_context_finding.py"
      - "scripts/resolve_regenerated_aoharu_ignition_finding.py"
      - "scripts/resolve_regenerated_initial_friendship_finding.py"
      - "scripts/resolve_regenerated_grand_live_performance_stats_findings.py"
      - "scripts/harden_training_support_effect_labels.py"
      - "scripts/build_source_bridge_risk_registry.py"
      - "scripts/apply_terminology_reviews.py"
      - "scripts/harden_audit_findings.py"
      - "scripts/harden_*_finding.py"
      - "src/hachimi_tl_vi/context_categories.py"
      - "src/hachimi_tl_vi/context_registry.py"
      - "src/hachimi_tl_vi/translators/prompt.py"
      - "glossary/term_registry.json"
      - "glossary/observed_terms.json"
      - "glossary/terminology_reviews.json"
      - "glossary/canonical_findings.json"
      - "glossary/ui_community_terms.json"
      - "glossary/source_bridge_terms.json"
      - "tests/test_audit_finding_hardening.py"
      - "tests/test_*_finding_hardening.py"
      - "tests/test_scoped_canonical_override_resolution.py"
      - "tests/test_fast_step_context_guard_resolution.py"
      - "tests/test_context_guard_finding_resolution.py"
      - "tests/test_jewel_context_guard_resolution.py"
      - "tests/test_recovery_spirit_context_guard_resolution.py"
      - "tests/test_innovation_context_guard_resolution.py"
      - "tests/test_triumph_context_guard_resolution.py"
      - "tests/test_fuchu_himba_context_guard_resolution.py"
      - "tests/test_context_registry.py"
      - "tests/test_context_sync.py"
      - "tests/test_prompt_context.py"
      - "tests/test_source_bridge_prompt.py"
      - "tests/test_source_bridge_risk_registry.py"
      - "tests/test_terminology_review.py"
      - "tests/test_apply_terminology_reviews.py"
      - "tests/test_context_sync_workflow_persistence.py"
      - "tests/test_context_sync_auto_hardener.py"
      - "pyproject.toml"
      - ".github/workflows/sync-context.yml"

permissions:
  contents: write

concurrency:
  group: sync-translation-context
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Sync canonical character identities
        run: python scripts/sync_context_registry.py

      - name: Extract terminology candidates
        run: python scripts/extract_context_candidates.py

      - name: Refresh observed entity terminology
        run: python scripts/build_observed_term_memory.py

      - name: Migrate pre-apply reviewed lock compatibility
        shell: bash
        run: |
          set -euo pipefail
          python scripts/harden_pace_chaser_skill_lock_finding.py
          python scripts/harden_star_ascension_finding.py
          python scripts/harden_stamina_threshold_finding.py
          python scripts/harden_transcend_overdrive_finding.py
          python scripts/harden_uma_plan_finding.py

      - name: Apply explicit reviewed terminology locks
        shell: bash
        run: |
          set -o pipefail
          python scripts/apply_terminology_reviews.py 2>&1 | tee /tmp/apply-terminology-reviews.log

      - name: Upload terminology review apply diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminology-review-apply-diagnostics-${{ github.run_id }}
          path: /tmp/apply-terminology-reviews.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Harden audit-discovered canonical rules
        run: python scripts/harden_audit_findings.py

      - name: Harden support-effect labels
        run: python scripts/harden_training_support_effect_labels.py

      - name: Run all finding hardeners
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/harden_*_finding.py; do
            echo "Running $script"
            python "$script"
          done

      - name: Build source-bridge risk registry
        run: python scripts/build_source_bridge_risk_registry.py

      - name: Refresh worker-reported canonical findings
        run: python scripts/canonical_findings.py --repo-root . --refresh

      - name: Resolve scoped canonical overrides
        run: python scripts/resolve_scoped_canonical_overrides.py --repo-root .

      - name: Resolve context-guard findings
        run: python scripts/resolve_context_guard_findings.py

      - name: Resolve narrative running-style finding
        run: python scripts/resolve_running_style_narrative_finding.py

      - name: Resolve regenerated super-long-distance finding
        run: python scripts/resolve_regenerated_super_long_distance_context_finding.py

      - name: Resolve regenerated Aoharu Ignition finding
        run: python scripts/resolve_regenerated_aoharu_ignition_finding.py

      - name: Resolve regenerated Initial Friendship finding
        run: python scripts/resolve_regenerated_initial_friendship_finding.py

      - name: Resolve regenerated Grand Live performance findings
        run: python scripts/resolve_regenerated_grand_live_performance_stats_findings.py

      - name: Build terminology review queue
        run: python scripts/build_terminology_review_queue.py

      - name: Test context pipeline
        run: pytest -q

      - name: Commit generated context if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            glossary/characters.json \
            glossary/generated_candidates.json \
            glossary/observed_terms.json \
            glossary/term_registry.json \
            glossary/terminology_reviews.json \
            glossary/canonical_findings.json \
            glossary/terminology_review_queue.json \
            glossary/ui_community_terms.json \
            glossary/source_bridge_terms.json \
            glossary/source_bridge_risks.generated.json
          if git diff --cached --quiet; then
            echo "Context is already current."
            exit 0
          fi
          git commit -m "Sync translation context from pinned source"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Concurrent main update; retry $attempt/5"
            sleep $((attempt * 3))
          done
          echo "Could not publish generated context without a safe fast-forward."
          exit 1
