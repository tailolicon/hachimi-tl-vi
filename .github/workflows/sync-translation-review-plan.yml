name: Sync translation review plan

on:
  push:
    branches: [main]
    paths:
      - "localized_data/**"
      - "work/merged/**"
      - "work/translation_review/reviewed_index.json"
      - "work/translation_review/merged/**"
      - "TRANSLATION_REVIEW.md"
      - "GAME_CONTEXT.md"
      - "glossary/term_registry.json"
      - "glossary/ui_community_terms.json"
      - "glossary/source_bridge_terms.json"
      - "glossary/translation_audit_policy.json"
      - "glossary/skill_name_style.json"
      - "glossary/style_rules.json"
      - "glossary/canonical_findings.json"
      - "glossary/terminology_reviews.json"
      - "scripts/enforce_player_facing_canon.py"
      - "scripts/harden_audit_findings.py"
      - "scripts/harden_character_training_ui_canon.py"
      - "scripts/harden_skill_inheritance_canon.py"
      - "scripts/harden_race_canon.py"
      - "scripts/build_translation_review_plan.py"
      - "scripts/translation_review_common.py"
      - "scripts/canonical_findings.py"
      - "scripts/merge_translation_review.py"
      - "scripts/merge_parallel_results.py"
      - "scripts/aggregate_parallel_results.py"
      - "src/hachimi_tl_vi/translation_guard.py"
      - "src/hachimi_tl_vi/context_categories.py"
      - "tests/test_translation_review.py"
      - "tests/test_review_progress_stability.py"
      - "tests/test_translation_guard.py"
      - "tests/test_condition_reference_hardening.py"
      - "tests/test_skill_inheritance_hardening.py"
      - "tests/test_race_hardening.py"
      - "tests/test_translation_review_gate_idempotence.py"
      - ".github/workflows/sync-translation-review-plan.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-translation-review-plan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce canon and publish retrospective translation review plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B translation-review-plan origin/main

            # One-time self-healing migration for Audit Round 1 progress semantics.
            # It is idempotent and becomes a no-op after the source fix lands.
            python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          common = Path("scripts/translation_review_common.py")
          replace_once(
              common,
              '''CONTEXT_PATHS = (
              "TRANSLATION_REVIEW.md",
              "GAME_CONTEXT.md",
              "glossary/term_registry.json",
              "glossary/ui_community_terms.json",
              "glossary/translation_audit_policy.json",
              "glossary/skill_name_style.json",
              "glossary/style_rules.json",
          )''',
              '''CONTEXT_PATHS = (
              "GAME_CONTEXT.md",
              "glossary/translation_audit_policy.json",
              "glossary/skill_name_style.json",
              "glossary/style_rules.json",
          )''',
          )
          replace_once(
              common,
              '''def item_scoped_policy_hash(repo_root: Path) -> str:
              semantic: dict[str, list[dict[str, Any]]] = {}
              for rel in ("glossary/term_registry.json", "glossary/ui_community_terms.json"):
                  payload = load_json(repo_root / rel, {}) or {}
                  terms = payload.get("terms", []) if isinstance(payload, dict) else []
                  semantic[rel] = sorted(
                      [
                          term for term in terms
                          if isinstance(term, dict) and str(term.get("invalidation_scope", "")) == "item"
                      ],
                      key=lambda term: str(term.get("id", "")),
                  )
              finding_payload = load_json(repo_root / CANONICAL_FINDINGS_PATH, {}) or {}
              semantic[CANONICAL_FINDINGS_PATH] = sorted(
                  [finding_semantic_view(finding) for finding in active_findings(finding_payload)],
                  key=lambda finding: str(finding.get("finding_id", "")),
              )
              encoded = json.dumps(semantic, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()
          ''',
              '''def item_scoped_policy_hash(repo_root: Path) -> str:
              """Hash terminology policy that can reopen only matching review items.

              Canonical findings are intentionally excluded from plan identity: the
              merger applies active findings dynamically item-by-item. Evidence growth
              or a newly reported finding therefore cannot churn the entire active plan.
              """
              semantic: dict[str, list[dict[str, Any]]] = {}
              for rel in ("glossary/term_registry.json", "glossary/ui_community_terms.json"):
                  payload = load_json(repo_root / rel, {}) or {}
                  terms = payload.get("terms", []) if isinstance(payload, dict) else []
                  semantic[rel] = sorted(
                      [term for term in terms if isinstance(term, dict)],
                      key=lambda term: str(term.get("id", "")),
                  )
              encoded = json.dumps(semantic, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()
          ''',
          )
          replace_once(
              common,
              '''            if str(term.get("invalidation_scope", "")) != "item":
                          continue
                      if not _context_matches(term, key=key, source_path=source_path, json_path=json_path):''',
              '''            if not _context_matches(term, key=key, source_path=source_path, json_path=json_path):''',
          )

          merger = Path("scripts/merge_translation_review.py")
          replace_once(
              merger,
              '''        "superseded_batches": [],
                  "already_merged": [],''',
              '''        "superseded_batches": [],
                  "quarantined_batches": [],
                  "already_merged": [],''',
          )
          replace_once(
              merger,
              '''        if completion.get("result_path") != expected_result.as_posix():
                      raise ValueError(f"{batch_id}: completion result_path mismatch")
                  result = load_json(repo_root / expected_result)''',
              '''        quarantine_path = review_root / "quarantine" / f"{batch_id}.json"
                  if completion.get("result_path") != expected_result.as_posix():
                      errors = ["completion result_path mismatch"]
                      write_json(quarantine_path, {
                          "schema_version": 1,
                          "status": "quarantined",
                          "plan_id": plan_id,
                          "batch_id": batch_id,
                          "claim_id": claim_id,
                          "quarantined_at": utc_now(),
                          "errors": errors,
                      })
                      report["quarantined_batches"].append({"batch_id": batch_id, "errors": errors})
                      continue
                  result = load_json(repo_root / expected_result)''',
          )
          replace_once(
              merger,
              '''        if errors:
                      raise ValueError(f"{batch_id}: " + "; ".join(errors))
          ''',
              '''        if errors:
                      write_json(quarantine_path, {
                          "schema_version": 1,
                          "status": "quarantined",
                          "plan_id": plan_id,
                          "batch_id": batch_id,
                          "claim_id": claim_id,
                          "quarantined_at": utc_now(),
                          "errors": errors,
                      })
                      report["quarantined_batches"].append({"batch_id": batch_id, "errors": errors})
                      continue
                  quarantine_path.unlink(missing_ok=True)
          ''',
          )

          test = Path("tests/test_review_progress_stability.py")
          if not test.exists():
              test.write_text('''from __future__ import annotations

          import json

          from scripts.translation_review_common import (
              context_snapshot_hash,
              item_scoped_context_hash,
              item_scoped_policy_hash,
          )


def _write(path, payload):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")


def test_terminology_changes_do_not_churn_global_context(tmp_path):
              glossary = tmp_path / "glossary"
              _write(glossary / "term_registry.json", {"terms": []})
              _write(glossary / "ui_community_terms.json", {"terms": []})
              before_context = context_snapshot_hash(tmp_path)
              before_policy = item_scoped_policy_hash(tmp_path)
              _write(glossary / "term_registry.json", {"terms": [{
                  "id": "race.grade.g1",
                  "zh_cn": ["GⅠ"],
                  "target_vi": "G1",
                  "locked": True,
              }]})
              assert context_snapshot_hash(tmp_path) == before_context
              assert item_scoped_policy_hash(tmp_path) != before_policy
              assert item_scoped_context_hash(
                  key=None,
                  source="GⅠ",
                  source_path="text_data_dict.json",
                  json_path=["1", "1"],
                  locked_terms=json.loads((glossary / "term_registry.json").read_text())["terms"],
                  community_terms=[],
              ) is not None
              assert item_scoped_context_hash(
                  key=None,
                  source="unrelated",
                  source_path="text_data_dict.json",
                  json_path=["1", "2"],
                  locked_terms=json.loads((glossary / "term_registry.json").read_text())["terms"],
                  community_terms=[],
              ) is None


def test_canonical_findings_do_not_change_plan_policy_identity(tmp_path):
              glossary = tmp_path / "glossary"
              _write(glossary / "term_registry.json", {"terms": []})
              _write(glossary / "ui_community_terms.json", {"terms": []})
              _write(glossary / "canonical_findings.json", {"findings": []})
              before = item_scoped_policy_hash(tmp_path)
              _write(glossary / "canonical_findings.json", {"findings": [{
                  "finding_id": "cf-test",
                  "status": "open",
                  "source_zh_cn": "测试",
                  "match_mode": "exact",
              }]})
              assert item_scoped_policy_hash(tmp_path) == before
          ''', encoding="utf-8", newline="\n")

          marker = Path("work/translation_review/context_hash_semantics_v2.json")
          if not marker.exists():
              from scripts.translation_review_common import context_snapshot_hash, load_json, write_json
              root = Path(".").resolve()
              current_hash = context_snapshot_hash(root)
              reviewed_path = Path("work/translation_review/reviewed_index.json")
              reviewed = load_json(reviewed_path, {"schema_version": 1, "policy_version": 3, "entries": {}})
              migrated = 0
              for row in reviewed.get("entries", {}).values():
                  if not isinstance(row, dict):
                      continue
                  if int(row.get("policy_version", 0)) != 3 or str(row.get("action", "")) not in {"keep", "revise"}:
                      continue
                  row["context_snapshot_sha256"] = current_hash
                  migrated += 1
              write_json(reviewed_path, reviewed)
              write_json(marker, {
                  "schema_version": 1,
                  "migration": "global-context-v2-item-effective-terminology",
                  "context_snapshot_sha256": current_hash,
                  "migrated_resolved_entries": migrated,
              })
              print(f"Migrated {migrated} resolved review entries to context hash semantics v2.")
          PY

            python scripts/enforce_player_facing_canon.py
            python scripts/harden_audit_findings.py
            python scripts/harden_character_training_ui_canon.py
            python scripts/harden_skill_inheritance_canon.py
            python scripts/harden_race_canon.py
            python scripts/canonical_findings.py --repo-root . --refresh
            python -m pip install -e ".[dev]"
            pytest -q
            python scripts/build_translation_review_plan.py --repo-root . --batch-size 20

            # Keep the open translation-review gate's semantic state byte-stable
            # when the active plan is unchanged. The builder owns the canonical
            # reason; this normalization only restores lifecycle timestamps.
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from scripts.build_translation_review_plan import normalize_gate_state_for_noop

          path = Path("work/parallel_state.json")
          before = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:work/parallel_state.json"],
              encoding="utf-8",
          ))
          after = json.loads(path.read_text(encoding="utf-8"))
          normalized = normalize_gate_state_for_noop(after, before)
          if normalized != after:
              path.write_text(
                  json.dumps(normalized, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print("Ignored timestamp-only translation review gate churn.")
          PY

            git add \
              TRANSLATION_REVIEW.md \
              glossary/term_registry.json \
              glossary/ui_community_terms.json \
              glossary/source_bridge_terms.json \
              glossary/translation_audit_policy.json \
              glossary/canonical_findings.json \
              glossary/terminology_reviews.json \
              scripts/enforce_player_facing_canon.py \
              scripts/harden_audit_findings.py \
              scripts/harden_character_training_ui_canon.py \
              scripts/harden_skill_inheritance_canon.py \
              scripts/harden_race_canon.py \
              scripts/canonical_findings.py \
              scripts/translation_review_common.py \
              scripts/build_translation_review_plan.py \
              scripts/merge_translation_review.py \
              scripts/merge_parallel_results.py \
              scripts/aggregate_parallel_results.py \
              tests/test_review_progress_stability.py \
              tests/test_race_hardening.py \
              tests/test_translation_review_gate_idempotence.py \
              src/hachimi_tl_vi/translation_guard.py \
              src/hachimi_tl_vi/context_categories.py \
              work/translation_review \
              work/parallel_state.json
            if git diff --cached --quiet; then
              echo "Canonical terminology and translation review plan/gate are already current."
              exit 0
            fi
            git commit -m "Translation review: stabilize incremental audit progress"

            # Review workers frequently append isolated claim/result commits to main.
            # Rebase this already-validated generated commit over that harmless churn
            # before rebuilding the full plan. If a true generated-state conflict is
            # encountered, abort and let the outer loop rebuild from fresh main.
            for push_attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                break
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep "$push_attempt"
            done

            sleep $((attempt * 2))
          done

          echo "Failed to publish canonical terminology/review plan after retries" >&2
          exit 1
