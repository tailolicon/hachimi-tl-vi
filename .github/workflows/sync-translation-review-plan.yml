name: Sync translation review plan

on:
  push:
    branches: [main]
    paths:
      - "localized_data/**"
      - "work/merged/**"
      - "work/translation_review/reviewed_index.json"
      - "work/translation_review/merged/**"
      - "TRANSLATION_REVIEW.md"
      - "GAME_CONTEXT.md"
      - "glossary/term_registry.json"
      - "glossary/ui_community_terms.json"
      - "glossary/source_bridge_terms.json"
      - "glossary/translation_audit_policy.json"
      - "glossary/skill_name_style.json"
      - "glossary/style_rules.json"
      - "glossary/canonical_findings.json"
      - "glossary/terminology_reviews.json"
      - "scripts/enforce_player_facing_canon.py"
      - "scripts/harden_audit_findings.py"
      - "scripts/harden_character_training_ui_canon.py"
      - "scripts/harden_skill_inheritance_canon.py"
      - "scripts/harden_race_canon.py"
      - "scripts/harden_*_finding.py"
      - "scripts/build_translation_review_plan.py"
      - "scripts/translation_review_common.py"
      - "scripts/repair_translation_review_progress.py"
      - "scripts/canonical_findings.py"
      - "scripts/resolve_scoped_canonical_overrides.py"
      - "scripts/resolve_context_guard_findings.py"
      - "scripts/resolve_running_style_narrative_finding.py"
      - "scripts/resolve_regenerated_super_long_distance_context_finding.py"
      - "scripts/resolve_regenerated_aoharu_ignition_finding.py"
      - "scripts/resolve_regenerated_initial_friendship_finding.py"
      - "scripts/resolve_regenerated_grand_live_performance_stats_findings.py"
      - "scripts/refresh_translation_review_batch_findings.py"
      - "scripts/merge_translation_review.py"
      - "scripts/merge_parallel_results.py"
      - "scripts/aggregate_parallel_results.py"
      - "src/hachimi_tl_vi/translation_guard.py"
      - "src/hachimi_tl_vi/context_categories.py"
      - "tests/test_translation_review.py"
      - "tests/test_review_progress_stability.py"
      - "tests/test_translation_guard.py"
      - "tests/test_condition_reference_hardening.py"
      - "tests/test_skill_inheritance_hardening.py"
      - "tests/test_race_hardening.py"
      - "tests/test_translation_review_gate_idempotence.py"
      - "tests/test_context_sync_workflow_persistence.py"
      - "tests/test_*_finding_hardening.py"
      - "tests/test_*_context_guard_resolution.py"
      - ".github/workflows/sync-translation-review-plan.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-translation-review-plan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce canon and publish retrospective translation review plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B translation-review-plan origin/main

            # One-time migration plus permanent idempotent source semantics. This
            # restores valid keep/revise audit results before any plan is rebuilt;
            # affected entries still reopen through item-context fingerprints.
            python scripts/repair_translation_review_progress.py
            python scripts/enforce_player_facing_canon.py
            python scripts/harden_audit_findings.py
            python scripts/harden_character_training_ui_canon.py
            python scripts/harden_skill_inheritance_canon.py
            python scripts/harden_race_canon.py
            # Keep review-plan generation on the same permanent finding-hardener
            # surface as sync-context. Otherwise a plan rebuild can restore base
            # canonical files and silently erase a finding-specific guard that was
            # already proven and persisted by production context Sync.
            for script in scripts/harden_*_finding.py; do
              echo "Running $script"
              python "$script"
            done
            python scripts/canonical_findings.py --repo-root . --refresh
            # Direct canonical refresh deliberately clears derived resolutions.
            # Restore the same post-refresh resolver surface used by production
            # context Sync before worker-facing batch snapshots are refreshed.
            python scripts/resolve_scoped_canonical_overrides.py --repo-root .
            python scripts/resolve_context_guard_findings.py
            python scripts/resolve_running_style_narrative_finding.py
            python scripts/resolve_regenerated_super_long_distance_context_finding.py
            python scripts/resolve_regenerated_aoharu_ignition_finding.py
            python scripts/resolve_regenerated_initial_friendship_finding.py
            python scripts/resolve_regenerated_grand_live_performance_stats_findings.py
            # Canonical findings are intentionally excluded from plan identity so
            # evidence churn does not rebuild thousands of batches. Refresh only the
            # unresolved active batch snapshots to keep worker-facing evidence live.
            python scripts/refresh_translation_review_batch_findings.py --repo-root .
            python -m pip install -e ".[dev]"
            pytest -q
            python scripts/build_translation_review_plan.py --repo-root . --batch-size 20

            # Keep the open translation-review gate's semantic state byte-stable
            # when the active plan is unchanged. The builder owns the canonical
            # reason; this normalization only restores lifecycle timestamps.
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from scripts.build_translation_review_plan import normalize_gate_state_for_noop

          path = Path("work/parallel_state.json")
          before = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:work/parallel_state.json"],
              encoding="utf-8",
          ))
          after = json.loads(path.read_text(encoding="utf-8"))
          normalized = normalize_gate_state_for_noop(after, before)
          if normalized != after:
              path.write_text(
                  json.dumps(normalized, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print("Ignored timestamp-only translation review gate churn.")
          PY

            git add \
              TRANSLATION_REVIEW.md \
              glossary/term_registry.json \
              glossary/ui_community_terms.json \
              glossary/source_bridge_terms.json \
              glossary/translation_audit_policy.json \
              glossary/canonical_findings.json \
              glossary/terminology_reviews.json \
              scripts/enforce_player_facing_canon.py \
              scripts/harden_audit_findings.py \
              scripts/harden_character_training_ui_canon.py \
              scripts/harden_skill_inheritance_canon.py \
              scripts/harden_race_canon.py \
              scripts/canonical_findings.py \
              scripts/resolve_context_guard_findings.py \
              scripts/refresh_translation_review_batch_findings.py \
              scripts/translation_review_common.py \
              scripts/repair_translation_review_progress.py \
              scripts/build_translation_review_plan.py \
              scripts/merge_translation_review.py \
              scripts/merge_parallel_results.py \
              scripts/aggregate_parallel_results.py \
              tests/test_review_progress_stability.py \
              tests/test_race_hardening.py \
              tests/test_translation_review_gate_idempotence.py \
              src/hachimi_tl_vi/translation_guard.py \
              src/hachimi_tl_vi/context_categories.py \
              work/translation_review \
              work/parallel_state.json
            if git diff --cached --quiet; then
              echo "Canonical terminology and translation review plan/gate are already current."
              exit 0
            fi
            git commit -m "Translation review: restore progress and sync active plan"

            # Review workers frequently append isolated claim/result commits to main.
            # Rebase this already-validated generated commit over that harmless churn
            # before rebuilding the full plan. If a true generated-state conflict is
            # encountered, abort and let the outer loop rebuild from fresh main.
            for push_attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                break
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep "$push_attempt"
            done

            sleep $((attempt * 2))
          done

          echo "Failed to publish canonical terminology/review plan after retries" >&2
          exit 1
