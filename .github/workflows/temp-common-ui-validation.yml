name: TEMP Common UI validation
on:
  push:
    branches: [canonical-common-ui-system-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_common_ui_labels_hardening.py
      - run: pytest -q
      - name: Materialize common UI canonical data
        run: |
          python scripts/harden_common_ui_labels.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glossary/ui_community_terms.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize common UI canonical labels [skip ci]"
            git push
          fi
      - name: Prove hardener no-op after materialization
        run: |
          python scripts/harden_common_ui_labels.py
          git diff --exit-code glossary/ui_community_terms.json
