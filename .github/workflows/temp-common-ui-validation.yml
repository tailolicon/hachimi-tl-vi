name: TEMP Common UI validation
on:
  push:
    branches: [canonical-common-ui-system-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-common-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_common_ui_labels_hardening.py
      - run: pytest -q
      - name: Materialize common UI canonical data safely
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python scripts/harden_common_ui_labels.py
            pytest -q
            git add glossary/ui_community_terms.json

            if git diff --cached --quiet; then
              echo "Canonical data is already materialized."
              exit 0
            fi

            git commit -m "Materialize common UI canonical labels [skip ci]"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            echo "Concurrent branch update detected; retrying on the latest branch head ($attempt/3)."
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish materialized data after 3 race-safe attempts." >&2
              exit 1
            fi
          done
      - name: Prove hardener no-op after materialization
        run: |
          python scripts/harden_common_ui_labels.py
          git diff --exit-code glossary/ui_community_terms.json
