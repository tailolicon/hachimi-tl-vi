name: Temp training-support Support Effects validation

on:
  push:
    branches:
      - canonical-training-support-hardening
    paths:
      - scripts/harden_training_support_labels.py
      - tests/test_training_support_labels_hardening.py
      - .github/workflows/temp-training-support-support-effects.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-training-support-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Materialize canonical glossary
        run: python scripts/harden_training_support_labels.py
      - name: Focused Training Support regressions
        run: pytest -q tests/test_training_support_hardening.py tests/test_training_support_labels_hardening.py
      - name: Full pytest
        run: pytest -q
      - name: Validate canonical data
        run: |
          tlvi --db /tmp/tlvi.db validate
          tlvi --db /tmp/tlvi.db index --out /tmp/index.json
      - name: Commit materialized glossary
        run: |
          if git diff --quiet -- glossary/term_registry.json glossary/ui_community_terms.json; then
            echo 'No glossary delta to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glossary/term_registry.json glossary/ui_community_terms.json
          git commit -m 'materialize Support Effects canonical label'
          git push origin HEAD:canonical-training-support-hardening
