name: Validate Resources Gacha Shop W2

on:
  push:
    branches:
      - canonical-resources-gacha-shop-hardening
    paths:
      - 'scripts/harden_resources_gacha_shop_canon.py'
      - 'tests/test_resources_gacha_shop*.py'
      - '.github/workflows/validate-resources-gacha-shop-w2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-resources-gacha-shop-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Materialize canonical bridge
        run: python scripts/harden_resources_gacha_shop_canon.py
      - name: Focused tests
        run: python -m pytest -q tests/test_resources_gacha_shop*.py
      - name: Idempotence
        run: |
          cp glossary/source_bridge_terms.json /tmp/bridge.json
          python scripts/harden_resources_gacha_shop_canon.py
          cmp /tmp/bridge.json glossary/source_bridge_terms.json
      - name: Persist materialized glossary if changed
        run: |
          if ! git diff --quiet -- glossary/source_bridge_terms.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add glossary/source_bridge_terms.json
            git commit -m 'materialize resources gacha shop canonical bridge'
            git push origin HEAD:canonical-resources-gacha-shop-hardening
          fi
