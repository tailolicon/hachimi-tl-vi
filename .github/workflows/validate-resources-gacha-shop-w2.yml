name: Validate Resources Gacha Shop W2

on:
  push:
    branches:
      - canonical-resources-gacha-shop-hardening
    paths:
      - scripts/harden_resources_gacha_shop_canon.py
      - tests/test_resources_gacha_shop_hardening.py
      - .github/workflows/validate-resources-gacha-shop-w2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-resources-gacha-shop-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e . pytest
      - name: Materialize resource hardening
        run: python scripts/harden_resources_gacha_shop_canon.py
      - name: Focused regression tests
        run: pytest -q tests/test_resources_gacha_shop_hardening.py
      - name: Hardener idempotence
        run: |
          cp glossary/source_bridge_terms.json /tmp/source_bridge_terms.json
          python scripts/harden_resources_gacha_shop_canon.py
          cmp /tmp/source_bridge_terms.json glossary/source_bridge_terms.json
      - name: Persist materialized bridge rules
        run: |
          if git diff --quiet -- glossary/source_bridge_terms.json; then
            echo "No materialized change"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glossary/source_bridge_terms.json
          git commit -m "Materialize scoped resource bridge canon"
          git push origin HEAD:canonical-resources-gacha-shop-hardening
