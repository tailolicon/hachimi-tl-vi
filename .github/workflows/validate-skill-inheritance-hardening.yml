name: Validate skill inheritance hardening

on:
  push:
    branches:
      - canonical-skill-inheritance-hardening-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce and test hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/enforce_player_facing_canon.py
          python scripts/harden_skill_inheritance_canon.py
          python -m pip install -e ".[dev]"
          pytest -q
          python scripts/build_translation_review_plan.py --repo-root . --batch-size 20
          git diff --check
