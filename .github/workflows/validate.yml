name: Validate

on:
  push:
    branches: [main]
    paths-ignore:
      - "work/claims/**"
      - "work/results/**"
      - "work/completions/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: tlvi --db /tmp/tlvi.db validate
      - run: tlvi --db /tmp/tlvi.db index --out /tmp/index.json
