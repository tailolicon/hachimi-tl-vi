name: Validate

on:
  push:
    branches: [main]
    paths-ignore:
      - "work/claims/**"
      - "work/results/**"
      - "work/completions/**"
      - "work/ui_review/claims/**"
      - "work/ui_review/results/**"
      - "work/ui_review/completions/**"
      - "work/translation_review/claims/**"
      - "work/translation_review/results/**"
      - "work/translation_review/completions/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m py_compile scripts/ui_review_common.py scripts/build_ui_review_plan.py scripts/merge_ui_review.py scripts/reap_ui_review_claims.py scripts/translation_review_common.py scripts/build_translation_review_plan.py scripts/merge_translation_review.py scripts/reap_translation_review_claims.py scripts/build_translation_regression_memory.py src/hachimi_tl_vi/translation_guard.py
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ github.run_id }}
          path: /tmp/pytest.log
          retention-days: 3
      - run: tlvi --db /tmp/tlvi.db validate
      - run: tlvi --db /tmp/tlvi.db index --out /tmp/index.json
