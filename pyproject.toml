[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hachimi-tl-vi"
version = "0.1.0"
description = "Vietnamese AI translation pipeline for Hachimi Edge (UM:PD JP)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "tailolicon"}]
dependencies = [
  "blake3>=0.4.1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
tlvi = "hachimi_tl_vi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
